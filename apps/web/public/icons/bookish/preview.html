<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookish Icons — Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Serif SC', 'Georgia', serif;
    background: #F5F0E8;
    color: #4A3F35;
    padding: 24px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; font-weight: 600; }
  .spec { font-size: 12px; color: #A89A8C; margin-bottom: 24px; }
  .spec span { color: #7A6D60; }

  .section { margin-bottom: 48px; }
  .section-title {
    font-family: 'EB Garamond', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #A89A8C;
    margin-bottom: 12px;
  }

  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .icon-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 14px 16px; min-width: 80px;
    border: 1px solid #E0D7C8; border-radius: 8px;
    background: rgba(245, 240, 232, 0.7);
  }
  .icon-card svg { display: block; }
  .icon-label { font-size: 11px; color: #7A6D60; }

  .dark-bg {
    background: #4A3F35; color: #F5F0E8;
    padding: 20px; border-radius: 10px;
    margin-top: 20px;
  }
  .dark-bg .section-title { color: rgba(245, 240, 232, 0.5); }
  .dark-bg .icon-card {
    border-color: rgba(245, 240, 232, 0.15);
    background: rgba(255, 255, 255, 0.04);
  }
  .dark-bg .icon-label { color: rgba(245, 240, 232, 0.6); }

  .tone-gold svg, .tone-gold .icon-label { color: #B89A46; }
  .tone-primary svg, .tone-primary .icon-label { color: #4A3F35; }
  .tone-secondary svg, .tone-secondary .icon-label { color: #7A6D60; }
  .tone-faint svg, .tone-faint .icon-label { color: #A89A8C; }
  .dark-bg .tone-primary svg, .dark-bg .tone-primary .icon-label { color: rgba(245, 240, 232, 0.85); }
  .dark-bg .tone-secondary svg, .dark-bg .tone-secondary .icon-label { color: rgba(245, 240, 232, 0.55); }
</style>
</head>
<body>

<h1>国风书卷图标集 · Bookish Icons</h1>
<p class="spec">
  预设 <span>bookish</span> ·
  网格 <span>24px</span> ·
  描边 <span>2px</span> ·
  圆角 <span>2px</span>
</p>

<div class="section">
  <div class="section-title">24px · Gold Tone</div>
  <div class="grid">
    <div class="icon-card tone-gold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v5l2 2v1H4v-1l2-2V9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="icon-label">bell</span></div>
    <div class="icon-card tone-gold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg><span class="icon-label">search</span></div>
    <div class="icon-card tone-gold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12l2 5-7 13L5 8z"/><polyline points="5 8 19 8"/></svg><span class="icon-label">bookmark</span></div>
    <div class="icon-card tone-gold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20l4-3 4 3V5a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2z"/></svg><span class="icon-label">edit</span></div>
    <div class="icon-card tone-gold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="11" height="14" rx="1.5"/><rect x="9" y="3" width="11" height="14" rx="1.5"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/><line x1="12" y1="7" x2="18" y2="7"/><line x1="12" y1="11" x2="18" y2="11"/></svg><span class="icon-label">brief</span></div>
    <div class="icon-card tone-gold"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="9" width="4" height="4" rx="0.5" transform="rotate(45 5 11)"/><rect x="10" y="9" width="4" height="4" rx="0.5" transform="rotate(45 12 11)"/><rect x="17" y="9" width="4" height="4" rx="0.5" transform="rotate(45 19 11)"/></svg><span class="icon-label">section-break</span></div>
  </div>
</div>

<div class="section">
  <div class="section-title">48px · Detail Inspection</div>
  <div class="grid">
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v5l2 2v1H4v-1l2-2V9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="icon-label">bell</span></div>
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg><span class="icon-label">search</span></div>
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12l2 5-7 13L5 8z"/><polyline points="5 8 19 8"/></svg><span class="icon-label">bookmark</span></div>
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20l4-3 4 3V5a2 2 0 0 0-2-2H10a2 2 0 0 0-2 2z"/></svg><span class="icon-label">edit</span></div>
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="11" height="14" rx="1.5"/><rect x="9" y="3" width="11" height="14" rx="1.5"/><line x1="7" y1="9" x2="13" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/><line x1="12" y1="7" x2="18" y2="7"/><line x1="12" y1="11" x2="18" y2="11"/></svg><span class="icon-label">brief</span></div>
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3" y="9" width="4" height="4" rx="0.5" transform="rotate(45 5 11)"/><rect x="10" y="9" width="4" height="4" rx="0.5" transform="rotate(45 12 11)"/><rect x="17" y="9" width="4" height="4" rx="0.5" transform="rotate(45 19 11)"/></svg><span class="icon-label">section-break</span></div>
  </div>
</div>

<div class="section dark-bg">
  <div class="section-title">Dark Background · Contrast Check</div>
  <div class="grid">
    <div class="icon-card tone-primary"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v5l2 2v1H4v-1l2-2V9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="icon-label">bell</span></div>
    <div class="icon-card tone-secondary"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg><span class="icon-label">search</span></div>
    <div class="icon-card tone-faint"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12l2 5-7 13L5 8z"/><polyline points="5 8 19 8"/></svg><span class="icon-label">bookmark</span></div>
  </div>
</div>

</body>
</html>
